# Bridge AI's hosted relay: the same Worker as everyone's own relay, with HOSTED on (HOSTED.md), on
# boldbridge.app, a domain of its own. From the repo, on the project's Cloudflare account, once the
# accounts service (account/README.md) is deployed:
#   node relay/build.js relay/dist/worker.js
#   npx wrangler@4.149.0 deploy -c relay/wrangler.hosted.toml
name = "bridge-relay"
main = "dist/worker.js"
compatibility_date = "2025-06-01"
workers_dev = false
preview_urls = false

# The bare domain (a small page, and where computers register) and one level below it (one
# address per computer). Both need a proxied DNS record (HOSTED.md).
routes = [
  { pattern = "boldbridge.app/*", zone_name = "boldbridge.app" },
  { pattern = "*.boldbridge.app/*", zone_name = "boldbridge.app" },
]

# One Hub per computer, plus one that counts computers and accounts. SQLite-backed, so Workers Free
# works too.
[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

# One Account per Bold Bridge account: its use in the window and the week, across its computers.
[[durable_objects.bindings]]
name = "ACCOUNT"
class_name = "Account"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Account"]

# The accounts service (account/), reached directly, never over the internet, through its Relay
# entrypoint, which has only /internal (never the admin view's /admin): whether an account and one of
# its devices may use the relay, and its use reported to it.
[[services]]
binding = "ACCOUNTS"
service = "bridge-accounts"
entrypoint = "Relay"

# The anonymous counts (HOSTED.md lists them). Leave this out and nothing is counted.
[[analytics_engine_datasets]]
binding = "STATS"
dataset = "bridge_relay"

[vars]
HOSTED = "1"
HOSTED_DOMAIN = "boldbridge.app"
# The accounts service's public key, which every relay token is checked with (account/key.js
# --public prints it). Empty, no computer can register or connect.
ACCOUNTS_PUBLIC_KEY = ""
# The kill switch: "1" (or a message of your own) refuses new computers and every connection.
HOSTED_OFF = "0"
# Each computer's limits. These are the defaults; HOSTED.md says why.
MAX_PHONES = "16"
MAX_MESSAGE_KB = "256"
MESSAGES_PER_SECOND = "200"
MESSAGE_BURST = "2000"
IDLE_DAYS = "90"
# Each account's, across its computers, like Claude's: a window of so many hours from its first
# message after the last one ended, and a week from its first use.
ACCOUNT_WINDOW_HOURS = "8"
ACCOUNT_WINDOW_MESSAGES = "150000"
ACCOUNT_WEEK_MESSAGES = "1000000"
# For the whole relay, so the bill stays under $50 a month (HOSTED.md, Cost): how many accounts may
# have a computer on it, and how many Cloudflare requests a day it may come to before it stops for
# everyone until 00:00 UTC. Raise either knowing what it costs.
MAX_ACCOUNTS = "500"
RELAY_DAILY_REQUESTS = "5000000"
# "1": the account is on Workers Paid (it must be before going live), so /_relay/stats measures
# against its allowance. "0" while trying it on Workers Free.
WORKERS_PAID = "1"
# Secrets, never here (npx wrangler@4.149.0 secret put <name> -c relay/wrangler.hosted.toml):
#   ID_SECRET    keys the checksum at the end of every computer's id; unset, the relay answers 500
#   STATS_TOKEN  reads GET /_relay/stats; unset, it isn't there at all

# No logs: nothing about a request (its IP address included) is kept by the Worker.
[observability]
enabled = false
