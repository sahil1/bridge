<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <meta name="referrer" content="no-referrer" />
  <link rel="icon" href="/mark.svg" />
  <link rel="modulepreload" href="/link.js" />
  <title>Shared with you</title>
  <style>
    :root { --bg: #f6f7f9; --fg: #15171c; --muted: #5d6470; --line: #d5d9e0; --card: #fff; --accent: #2563eb; --bad: #c62828; color-scheme: light; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b0d11; --fg: #e6e8ec; --muted: #9aa1ad; --line: #262a33; --card: #14171d; --accent: #3b82f6; --bad: #f87171; color-scheme: dark; } }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 15px/1.45 -apple-system, system-ui, "Segoe UI", sans-serif; }
    [hidden] { display: none !important; }
    #top { position: fixed; z-index: 2; top: 0; left: 0; right: 0; height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left)); background: var(--card); border-bottom: 1px solid var(--line); font-size: 13px; }
    #top img { width: 20px; height: 20px; flex: none; }
    #top b { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #top span { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #top .grow { flex: 1; }
    #view { position: fixed; top: 44px; left: 0; right: 0; bottom: 0; width: 100%; height: calc(100% - 44px); border: 0; display: block; background: #fff; }
    .card { min-height: 100%; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) 20px 24px; }
    .card > div { width: 100%; max-width: 380px; text-align: center; }
    .card img { width: 52px; height: 52px; }
    h1 { font-size: 20px; margin: 14px 0 6px; overflow-wrap: anywhere; }
    p { margin: 8px 0; color: var(--muted); overflow-wrap: anywhere; }
    form { display: grid; gap: 10px; margin-top: 18px; }
    input { height: 46px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--fg); font: inherit; font-size: 16px; padding: 0 12px; }
    input.code { font: 600 20px ui-monospace, Menlo, monospace; letter-spacing: 4px; text-align: center; }
    button { height: 44px; border-radius: 10px; border: 0; background: var(--accent); color: #fff; font: inherit; font-weight: 600; padding: 0 18px; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
    .err { color: var(--bad); }
    .small { font-size: 13px; }
    .spin { width: 22px; height: 22px; margin: 6px auto 0; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header id="top" hidden>
    <img src="/mark.svg" alt="" />
    <b id="top-title"></b>
    <span id="top-who"></span>
    <span class="grow"></span>
    <span id="top-state" role="status"></span>
  </header>
  <section id="wait" class="card">
    <div>
      <img src="/mark.svg" alt="" />
      <h1 id="wait-title">Opening…</h1>
      <p id="wait-text" role="status"></p>
      <div id="wait-spin" class="spin" aria-hidden="true"></div>
      <button id="retry" type="button" class="ghost" hidden>Try again</button>
    </div>
  </section>
  <section id="password" class="card" hidden>
    <div>
      <img src="/mark.svg" alt="" />
      <h1 id="password-title">This needs a password</h1>
      <p id="password-text"></p>
      <form id="password-form">
        <input id="password-input" type="password" autocomplete="off" aria-label="Password" placeholder="Password" required />
        <button id="password-go" type="submit">Open</button>
        <p id="password-err" class="err small" role="alert" hidden></p>
      </form>
    </div>
  </section>
  <section id="email" class="card" hidden>
    <div>
      <img src="/mark.svg" alt="" />
      <h1 id="email-title">Who are you?</h1>
      <p id="email-text">This was shared with people by their email. Enter yours, and a code to open it goes to it.</p>
      <form id="email-form">
        <input id="email-input" type="email" autocomplete="email" inputmode="email" aria-label="Your email" placeholder="you@example.com" required />
        <button id="email-go" type="submit">Send me a code</button>
        <p id="email-err" class="err small" role="alert" hidden></p>
      </form>
    </div>
  </section>
  <section id="code" class="card" hidden>
    <div>
      <img src="/mark.svg" alt="" />
      <h1>Enter your code</h1>
      <p id="code-text"></p>
      <form id="code-form">
        <input id="code-input" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" aria-label="Code" placeholder="000000" required />
        <button id="code-go" type="submit">Open</button>
        <button id="code-back" type="button" class="ghost">Use another email</button>
        <p id="code-err" class="err small" role="alert" hidden></p>
      </form>
    </div>
  </section>
  <iframe id="view" title="Shared with you" hidden referrerpolicy="no-referrer" allow="fullscreen; clipboard-write"></iframe>
  <script type="module" src="/share.js"></script>
</body>
</html>
