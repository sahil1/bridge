# Runs the tests on macOS, Windows and Linux (test.yml), then builds the desktop app on each,
# smoke-tests each build, and publishes a GitHub release with all of them. Nothing is built when a
# test fails.
#   Pushing a tag v<version> (npm run release does this) builds and publishes that release.
#   Running it by hand (Actions › Release › Run workflow) only builds and tests; the installers
#   are attached to the run so you can try them.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read-only, except publishing (the release job): the builds run npm packages' install scripts.
permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    name: Build (${{ matrix.platform }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-22.04
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Check for personal data
        run: node scripts/check-private.js

      - name: Install
        run: |
          npm ci --no-audit --no-fund
          npm --prefix desktop ci --no-audit --no-fund

      # Speech to text on the Mac itself (native/bridgespeech.swift) needs the macOS 26 SDK, which
      # comes with Xcode 26: the newest one here, if there is one. Without it, that helper is left out.
      - name: The newest Xcode
        if: runner.os == 'macOS'
        run: |
          x=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$x" ]; then sudo xcode-select -s "$x"; fi
          xcodebuild -version

      - name: Copy Bridge AI into the app
        working-directory: desktop
        run: node stage.js

      - name: Draw the app icon
        working-directory: desktop
        shell: bash
        timeout-minutes: 5 # seconds normally; a hung Electron fails the build instead of holding it
        # A build machine's graphics sometimes lose the picture ("UnknownVizError"). A fresh Electron
        # draws it fine, so it gets three tries. (Not drawn in software instead: on a Mac that leaves
        # faint seams between the sphere's facets.)
        run: |
          draw() { if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a npx electron render-icons.js; else npx electron render-icons.js; fi; }
          for try in 1 2 3; do
            draw && exit 0
            echo "Drawing the icon failed (try $try of 3)"
          done
          exit 1

      # Apple's notarization key (App Store Connect API), as the file electron-builder wants.
      - name: The notarization key
        if: matrix.platform == 'mac'
        shell: bash
        env:
          KEY: ${{ secrets.APPLE_API_KEY_P8 }}
        run: if [ -n "$KEY" ]; then printf '%s\n' "$KEY" > "$RUNNER_TEMP/AuthKey.p8"; fi

      - name: Build the app
        working-directory: desktop
        shell: bash
        # One more try if it fails: the build machine's network can drop out while Apple's servers are
        # in the middle of something, like handing back the notarization ticket to staple ("Failed to
        # staple your application with code: 68").
        run: npx electron-builder --${{ matrix.platform }} --publish never || { echo "The build failed; trying once more"; npx electron-builder --${{ matrix.platform }} --publish never; }
        # The Mac app is signed by desktop/sign.js with the Developer ID (BRIDGE_DEVID_P12), which Apple
        # then notarizes, so it opens with no warning; else with Bridge AI's own certificate
        # (BRIDGE_SIGN_P12), so macOS at least keeps what people allowed across updates; else ad hoc.
        # Notarizing needs all three APPLE_API_ values. Only the Mac build gets any of these.
        env:
          BRIDGE_SIGN_P12: ${{ matrix.platform == 'mac' && (secrets.BRIDGE_DEVID_P12 || secrets.BRIDGE_SIGN_P12) || '' }}
          BRIDGE_SIGN_PASSWORD: ${{ matrix.platform == 'mac' && (secrets.BRIDGE_DEVID_P12 && secrets.BRIDGE_DEVID_PASSWORD || secrets.BRIDGE_SIGN_PASSWORD) || '' }}
          APPLE_API_KEY: ${{ matrix.platform == 'mac' && secrets.APPLE_API_KEY_P8 && secrets.APPLE_API_KEY_ID && secrets.APPLE_API_ISSUER && format('{0}/AuthKey.p8', runner.temp) || '' }}
          APPLE_API_KEY_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_API_KEY_P8 && secrets.APPLE_API_ISSUER && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.platform == 'mac' && secrets.APPLE_API_KEY_P8 && secrets.APPLE_API_KEY_ID && secrets.APPLE_API_ISSUER || '' }}

      # macOS remembers what people allowed (their folders, the mic, Calendar) by the app's signature.
      # With the Developer ID it's the same for every version, so an update keeps all of it; signed any
      # other way (the secrets missing, say), an update would ask for everything again. Not released so.
      - name: The Mac app keeps what people allowed
        if: matrix.platform == 'mac' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          apps=$(find desktop/dist -maxdepth 2 -name 'Bridge AI.app')
          [ -n "$apps" ] || { echo "::error::No Bridge AI.app was built"; exit 1; }
          while IFS= read -r app; do
            for b in "$app" "$app/Contents/Frameworks/Bridge AI Helper.app"; do
              req=$(codesign -d -r- "$b" 2>&1)
              echo "$b: $req" | tail -1
              grep -q 'identifier "dev.bridge-ai.app' <<<"$req" && grep -q 'certificate leaf\[subject.OU\] = K6QK66LQDM' <<<"$req" ||
                { echo "::error::$b isn't signed with the Developer ID: updating to it would make macOS ask people for their folders, the mic and Calendar again"; exit 1; }
            done
          done <<<"$apps"

      - name: Smoke test
        run: node scripts/smoke.js

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bridge-ai-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            desktop/dist/Bridge-AI-*.dmg
            desktop/dist/Bridge-AI-*.zip
            desktop/dist/Bridge-AI-*.exe
            desktop/dist/Bridge-AI-*.AppImage
            desktop/dist/Bridge-AI-*.deb

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    # Writes the release, and signs where each download was built (GitHub's build provenance:
    # gh attestation verify <file> --repo sahil1/bridge).
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true

      - name: Notes and checksums
        run: |
          node scripts/release.js --notes notes.md
          cd out && sha256sum Bridge-AI-* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/Bridge-AI-*

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --title "Bridge AI $VERSION" --notes-file notes.md out/Bridge-AI-* out/SHA256SUMS.txt
