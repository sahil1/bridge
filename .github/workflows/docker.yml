# Builds the Docker image (the server only, for an always-on machine) for amd64 and arm64, checks
# that it starts, and pushes it to ghcr.io/sahil1/bridge.
#   Pushing a tag v<version> (npm run release does this) pushes <version>, <major>.<minor> and
#   latest. It runs apart from release.yml, so a problem here never holds up the desktop release.
#   A pull request that changes what goes into the image, or running it by hand (Actions › Docker
#   image › Run workflow), only builds and tests, so a release isn't the first to find a broken image.
name: Docker image

on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['Dockerfile', '.dockerignore', 'package.json', 'package-lock.json', '.github/workflows/docker.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Check for personal data
        run: node scripts/check-private.js

      # arm64 (Raspberry Pi, Apple Silicon, Arm servers) is built under emulation on this runner.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build for the test (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: bridge-ai:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name bridge bridge-ai:test
          for i in $(seq 30); do docker exec bridge bridge-ai status >/dev/null 2>&1 && break; sleep 2; done
          docker exec bridge bridge-ai status
          docker exec bridge git --version
          docker rm -f bridge

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/sahil1/bridge
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 and arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
