# Builds the Docker image (the server only, for an always-on machine) for amd64 and arm64, checks
# that it starts, and pushes it to ghcr.io/sahil1/bridge.
#   Pushing a tag v<version> (npm run release does this) pushes <version>, <major>.<minor> and
#   latest. It runs apart from release.yml, so a problem here never holds up the desktop release.
#   Running it by hand (Actions › Docker image › Run workflow) only builds and tests.
name: Docker image

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check for personal data
        run: node scripts/check-private.js

      # arm64 (Raspberry Pi, Apple Silicon, Arm servers) is built under emulation on this runner.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build for the test (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: bridge-ai:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name bridge bridge-ai:test
          for i in $(seq 30); do docker exec bridge bridge-ai status >/dev/null 2>&1 && break; sleep 2; done
          docker exec bridge bridge-ai status
          docker exec bridge git --version
          docker rm -f bridge

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/sahil1/bridge
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 and arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
