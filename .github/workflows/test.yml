# Bridge AI's tests (test/run.mjs). How many depends on why it runs:
#   a pull request: only the tests for the files it changes (each suite's `covers` in test/run.mjs),
#     and none when no test covers them (a change to the docs). A merge to main runs none: its pull
#     request's ran, and the nightly runs what changed since the last one;
#   a nightly build (nightly.yml, through release.yml): the tests for everything changed since the
#     last nightly;
#   a release's tag (release.yml), the run each night, and a run by hand: every test.
# The tests in a browser run in WebKit (the engine of Safari and the iPhone app) on macOS, which also
# sees the Mac's own pages, and in Chromium on Linux, in up to four shares (GitHub gives many Linux
# machines at once, and only five macOS ones); the tests in no browser run on macOS. Windows, and
# Linux's tests in no browser, only when every test runs, where a failure is said but stops nothing
# (it's fixed on its own). Beside them, the iPhone app is built for the Simulator on macOS and the
# Android app on Linux, when every test runs or the change is to mobile/. When something fails, the
# logs and screenshots are kept with the run for a week.
name: Tests

on:
  pull_request:
  # Each night (12:30 AM in California, 1:30 in summer): every test on main, while nobody waits on
  # it. What it finds is fixed in the next change.
  schedule:
    - cron: '30 8 * * *'
  workflow_call:
    inputs:
      base:
        description: Only the tests for what changed since this commit or tag (empty runs every test)
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      base:
        description: Only the tests for what changed since this commit, branch or tag (empty runs every test)
        type: string
        default: ''

permissions:
  contents: read

# A pull request's newer push calls off its older run, so the few macOS machines GitHub gives at once
# (five) go to what's current. Everything else (a nightly's or a release's tests, a run by hand) runs
# to its end.
concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which tests this run needs (test/run.mjs --list), before any machine is set up for them.
  scope:
    name: Which tests
    runs-on: ubuntu-latest
    outputs:
      args: ${{ steps.s.outputs.args }}
      count: ${{ steps.s.outputs.count }}
      mobile: ${{ steps.s.outputs.mobile }}
      machines: ${{ steps.s.outputs.machines }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: s
        env:
          ASKED: ${{ inputs.base }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$ASKED" ]; then base="$ASKED"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then base=
          elif [ "$EVENT" = pull_request ]; then base="$PR_BASE"
          elif [ "$EVENT" = push ]; then base="$BEFORE"
          else base=; fi
          # A base that isn't a commit here (a branch's first push, a mistyped tag): every test.
          if [ -n "$base" ] && { ! [[ "$base" =~ ^[A-Za-z0-9._/-]+$ ]] || ! git rev-parse -q --verify "$base^{commit}" >/dev/null; }; then
            echo "::notice::$base isn't a commit here, so every test runs"; base=
          fi
          if [ -n "$base" ]; then
            args="--base $base"
            git diff --name-only "$base...HEAD" | grep -q '^mobile/' && mobile=true || mobile=false
          else
            args=--all; mobile=true
          fi
          node test/run.mjs --list $args > scope.json
          node test/run.mjs --list $args --browser-only > scope-browser.json
          node test/run.mjs --list $args --no-browser > scope-none.json
          count=$(node -p "require('./scope.json').names.length")
          echo "args=$args" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "mobile=$mobile" >> "$GITHUB_OUTPUT"
          # The machines: the tests in no browser on macOS; the ones in a browser in WebKit on macOS
          # (two shares from 16, about 20 minutes on one) and in Chromium on Linux (a share for each
          # 25 or so, up to four). Windows, and Linux's in no browser, only for every test, where a
          # failure doesn't stop the run (optional).
          ALL="$([ -z "$base" ] && echo 1)" node -e '
            const b = require("./scope-browser.json").names.length, none = require("./scope-none.json").names.length
            const shares = (k, most) => (k ? Array.from({ length: Math.min(most, Math.max(1, Math.ceil(k / 25))) }, (_, i) => i + 1) : [])
            const of = (i, all) => (all.length > 1 ? ` ${i} of ${all.length}` : "")
            const m = []
            if (none) m.push({ os: "macos-15", name: "macOS", browser: "chromium", share: "--no-browser", optional: false })
            const wk = b ? (b >= 16 ? [1, 2] : [1]) : []
            for (const i of wk) m.push({ os: "macos-15", name: `macOS WebKit${of(i, wk)}`, browser: "webkit", share: `--browser-only${wk.length > 1 ? ` --shard ${i}/${wk.length}` : ""}`, optional: false })
            const lx = shares(b, 4)
            for (const i of lx) m.push({ os: "ubuntu-22.04", name: `Linux${of(i, lx)}`, browser: "chromium", share: `--browser-only${lx.length > 1 ? ` --shard ${i}/${lx.length}` : ""}`, optional: false })
            if (process.env.ALL) m.push({ os: "windows-latest", name: "Windows", browser: "chromium", share: "", optional: true }, { os: "ubuntu-22.04", name: "Linux, no browser", browser: "chromium", share: "--no-browser", optional: true })
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `machines=${JSON.stringify({ include: m })}\n`)
          '
          if [ -n "$base" ]; then
            echo "### $count of the tests, for what changed since $base" >> "$GITHUB_STEP_SUMMARY"
            node -p "require('./scope.json').names.join(', ') || 'None: no test covers these changes.'" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Every test ($count)" >> "$GITHUB_STEP_SUMMARY"
          fi

  test:
    name: Tests (${{ matrix.name }})
    needs: scope
    if: needs.scope.outputs.count != '0'
    # The machines the scope picked (above), as jobs side by side, in shares (test/run.mjs --shard,
    # each about as long) when there are many: in one, every suite took 55 to 85 minutes. Windows,
    # and Linux's tests in no browser, only for every test, can fail without failing the run.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.machines) }}
    continue-on-error: ${{ matrix.optional }}
    runs-on: ${{ matrix.os }}
    # Every suite takes 55 to 85 minutes in Chromium on one Mac or Windows runner, more with a test
    # tried again; a share, its part of that.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # what changed since the base, for a run of only the tests for that
          persist-credentials: false

      # This machine's tests (a WebKit share can have none: a change only to tests in no browser, or
      # to one test), so one with none sets nothing up. (The runner's own Node.js: --list needs no
      # packages.)
      - id: share
        name: Its tests
        shell: bash
        env:
          ARGS: ${{ needs.scope.outputs.args }} ${{ matrix.share }}
        run: |
          node test/run.mjs --list $ARGS > share.json
          echo "count=$(node -p "require('./share.json').names.length")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.share.outputs.count != '0'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.share.outputs.count != '0'
        run: npm ci --no-audit --no-fund

      - name: Build the app and the demo
        if: steps.share.outputs.count != '0'
        run: |
          npm run build
          npm run demo:build

      # The browsers' system packages (fonts, libraries) come from Ubuntu's servers, which GitHub's Linux
      # machines sometimes can't find for hours, and apt then takes half an hour to give up. Then the
      # browsers alone, with a warning, so the tests still run in time (the image has Chrome's libraries
      # already, and macOS runs the same tests with every font).
      - name: Browsers
        if: steps.share.outputs.count != '0'
        shell: bash
        run: |
          b="chromium ${{ matrix.browser != 'chromium' && 'webkit' || '' }}"
          if [ "$RUNNER_OS" != Linux ]; then exec npx playwright-core install --with-deps $b; fi
          if getent hosts azure.archive.ubuntu.com >/dev/null && timeout 300 npx playwright-core install --with-deps $b; then exit 0; fi
          echo "::warning::Ubuntu's packages couldn't be fetched, so the browsers run without them"
          npx playwright-core install $b

      # The desktop app's own Electron (the version in desktop/package-lock.json), for the tests of its
      # windows: the meeting card in a real window, zoomed and in each language (float-card-window).
      # Those are tests in no browser, so the machines for the ones in a browser go without.
      - name: Electron
        if: steps.share.outputs.count != '0' && matrix.browser == 'chromium' && !contains(matrix.share, '--browser-only')
        shell: bash
        run: |
          v=$(node -p "require('./desktop/package-lock.json').packages['node_modules/electron'].version")
          npm install --prefix "$RUNNER_TEMP/electron" --no-save --no-package-lock --no-audit --no-fund "electron@$v"
          # Its program is downloaded on first use, saying so on stdout: fetched here, and its path
          # written by Node itself, so nothing else lands in the line.
          node "$RUNNER_TEMP/electron/node_modules/electron/install.js"
          node -e "const fs = require('fs'), p = require(require('path').join(process.env.RUNNER_TEMP, 'electron', 'node_modules', 'electron')); if (!fs.existsSync(p)) throw new Error('no Electron at ' + p); fs.appendFileSync(process.env.GITHUB_ENV, 'BRIDGE_TEST_ELECTRON=' + p + '\\n')"

      # The herdr test drives a real herdr (elsewhere it checks only what it can without one): a
      # pinned release, refused unless it matches its checksum. It's a test in no browser, which runs
      # on Linux when every test runs.
      - name: herdr
        if: steps.share.outputs.count != '0' && runner.os == 'Linux' && !contains(matrix.share, '--browser-only')
        env:
          HERDR_URL: https://github.com/herdrdev/herdr/releases/download/v0.9.5/herdr-linux-x86_64
          HERDR_SHA256: 14d9e8bc8b4a9e0118d77c32266f76d461f09b40342eb23752960bd89f59929d
        run: |
          mkdir -p "$RUNNER_TEMP/herdr"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/herdr/herdr" "$HERDR_URL"
          echo "$HERDR_SHA256  $RUNNER_TEMP/herdr/herdr" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/herdr/herdr"
          echo "BRIDGE_TEST_HERDR=$RUNNER_TEMP/herdr/herdr" >> "$GITHUB_ENV"

      # bash on Windows too: PowerShell reads $ARGS as its own (empty) list of arguments, and the tests
      # for "what changed since the last commit" there are none.
      - name: Tests
        if: steps.share.outputs.count != '0'
        shell: bash
        env:
          ARGS: ${{ needs.scope.outputs.args }} ${{ matrix.share }}
        run: node test/run.mjs $ARGS --lanes 2 --browser ${{ matrix.browser }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-output-${{ matrix.name }}
          path: test/.out
          include-hidden-files: true
          retention-days: 7

  # The iPhone app, beside the tests rather than after them.
  ios:
    name: iPhone app
    needs: scope
    if: needs.scope.outputs.mobile == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      # The iPhone app (mobile/ios), built for the iPhone Simulator as it ships (Release), with no
      # signing, so a change to it or to what it carries (the phone page, the demo, Cloud agents)
      # can't break it unseen. With the newest Xcode here (the App Store takes Xcode 26 or later), a
      # Swift warning fails it, and XcodeGen is a pinned release, refused unless it matches its
      # checksum. The demo and Cloud agents are built first, so the app's own build finds them current.
      - name: iPhone app
        shell: bash
        env:
          XCODEGEN_URL: https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          x=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$x" ]; then export DEVELOPER_DIR="$x/Contents/Developer"; fi
          xcodebuild -version
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/xcodegen.zip" "$XCODEGEN_URL"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q -o "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          out="$GITHUB_WORKSPACE/mobile/ios/build/bundled"
          npm run --silent demo:build -- --outDir "$out/demo" --logLevel warn
          npm run --silent cloud:build -- --outDir "$out/cloud" --logLevel warn
          cd mobile/ios
          "$RUNNER_TEMP/xcodegen/xcodegen/bin/xcodegen" generate
          xcodebuild -quiet -project BridgeAI.xcodeproj -scheme BridgeAI -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/ios" \
            CODE_SIGNING_ALLOWED=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES build
          app="$RUNNER_TEMP/ios/Build/Products/Release-iphonesimulator/Bridge AI.app"
          for f in PrivacyInfo.xcprivacy demo/index.html cloud/index.html cloud/providers.json web/index.html PlugIns/Widgets.appex/Widgets; do
            [ -e "$app/$f" ] || { echo "::error::The iPhone app has no $f"; exit 1; }
          done

  # The Android app (mobile/android), built as it ships, with a key made for the run
  # (android-key.sh --dry-run): the debug APK, and the release APK shrunk by R8 and signed as a
  # release's is, so a change that breaks either shows up here. Not when release.yml runs these
  # tests for a tag: it builds the real one itself, and nothing here may hold up a desktop release.
  android:
    needs: scope
    if: github.ref_type != 'tag' && needs.scope.outputs.mobile == 'true'
    uses: ./.github/workflows/android.yml
    with:
      throwaway-key: true
