# Adds the Android app to a release that came out without it: 3.8.0 (out before the APK was), or
# one published while the release key wasn't set up or the Android build failed. Builds
# Bridge-AI-android.apk from that release's tag, signed with the release key (android.yml), signs
# where it was built (an attestation, as release.yml does), and uploads it to the release with its
# line in SHA256SUMS.txt. Run again, it replaces the APK and its line.
#   Actions › Android APK for a release › Run workflow, or
#   gh workflow run android-apk.yml --repo sahil1/bridge -f tag=v3.8.0
name: Android APK for a release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release's tag, like v3.8.0
        required: true
        type: string

permissions:
  contents: read

# One at a time for a release, so two runs can't write its SHA256SUMS.txt at once.
concurrency:
  group: android-apk-${{ inputs.tag }}

jobs:
  check:
    name: The release is there
    runs-on: ubuntu-latest
    steps:
      - name: A published release, with its checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::\"$TAG\" isn't a release's tag (like v3.8.0)"; exit 1; }
          state=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets --jq '"draft=\(.isDraft) sums=\(any(.assets[]; .name == "SHA256SUMS.txt"))"') ||
            { echo "::error::There's no release $TAG"; exit 1; }
          [ "$state" = "draft=false sums=true" ] || { echo "::error::$TAG is a draft, or has no SHA256SUMS.txt ($state)"; exit 1; }

  build:
    needs: check
    uses: ./.github/workflows/android.yml
    with:
      ref: ${{ inputs.tag }}
    secrets:
      BRIDGE_ANDROID_P12: ${{ secrets.BRIDGE_ANDROID_P12 }}
      BRIDGE_ANDROID_PASSWORD: ${{ secrets.BRIDGE_ANDROID_PASSWORD }}
      BRIDGE_ANDROID_ALIAS: ${{ secrets.BRIDGE_ANDROID_ALIAS }}

  publish:
    name: Add it to the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Signed with the release key
        if: needs.build.outputs.signed-with != 'release'
        run: |
          echo "::error::There's no Android release key on this repo, so there's no APK to add. Run npm run android:key on your Mac first."
          exit 1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bridge-ai-android
          path: out

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/Bridge-AI-android.apk

      # The release's checksums with the APK's line added (or put right), then both uploaded.
      - name: Upload
        working-directory: out
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS.txt --dir before
          { grep -v '  Bridge-AI-android\.apk$' before/SHA256SUMS.txt || true; sha256sum Bridge-AI-android.apk; } > SHA256SUMS.txt
          cat SHA256SUMS.txt
          [ "$(grep -vc '  Bridge-AI-android\.apk$' SHA256SUMS.txt)" = "$(grep -vc '  Bridge-AI-android\.apk$' before/SHA256SUMS.txt)" ] || { echo "::error::The other files' checksums would change"; exit 1; }
          gh release upload "$TAG" Bridge-AI-android.apk SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          echo "Added Bridge-AI-android.apk to $TAG: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
