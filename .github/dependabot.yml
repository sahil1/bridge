# Weekly pull requests for newer packages, GitHub Actions and the Docker image, once a version has
# been out for a week (the same wait as npm's min-release-age), so a bad publish is usually pulled
# before we see it.
# Security fixes come as soon as they're out (Dependabot security updates, set on the repo).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # The image stays on an LTS Node.js: odd majors never become one. Dependabot can't say "odd",
    # so they're named (Bundler-style ranges, which Docker tags use here).
    ignore:
      - dependency-name: node
        versions: ['~> 25.0', '~> 27.0', '~> 29.0', '~> 31.0']
